[project]
name = "sparkxray"
dynamic = ["version"]
description = "Read Spark event logs offline, with no JVM, and find why a run was slow: skew, spill, join choices, idle executors."
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-APACHE-2.0.txt"]
readme = "README.md"
keywords = ["spark", "pyspark", "event-log", "performance", "duckdb", "glue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

# AWS Glue 5.0 and 5.1 run Python 3.11, and the library is imported inside Glue
# jobs. Each dependency's floor is the oldest release verified against the code
# that imports it, so installing into a Glue job upgrades as little of its
# environment as it can.
requires-python = ">=3.11"
dependencies = [
    # S3 listing and downloads, imported only when a log is on S3. 1.28.0 is the
    # first release to read AWS_ENDPOINT_URL_S3, which reaches an S3-compatible store.
    "boto3>=1.28.0",
    # The raw lz4 and snappy blocks inside Spark's lz4-java and snappy-java streams.
    "cramjam>=2.8.0",
    # The REST API of a History Server or driver UI, imported only when a log is
    # read from one. httpx2 is the Pydantic-maintained continuation of httpx, and
    # 2.0.0 is its first release.
    "httpx2>=2.0.0",
    # Parses every event line and writes the Parquet tables. 1.5.0 is the first
    # release whose relation keeps its connection open, so `log.tables.tasks`
    # still reads after the Tables it came from is gone.
    "duckdb>=1.5.0",
    # Moves the plan rows into DuckDB, and is what `to_arrow_table()` returns.
    # 15.0.0 is the oldest release that imports beside the NumPy a resolver
    # picks: 14.0.0 and earlier take NumPy 2 and fail.
    "pyarrow>=15.0.0",
    # zstd read across frames and from a cut frame, which cramjam cannot stream.
    "zstandard>=0.19.0",
]

[project.urls]
Repository = "https://github.com/datapointchris/sparkxray"
Issues = "https://github.com/datapointchris/sparkxray/issues"
Changelog = "https://github.com/datapointchris/sparkxray/releases"

# The release tag is the version. python-semantic-release finds no file to
# stamp, so it tags the merge commit itself and writes no release commit.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "semver"

# A new commit or tag changes the version, so it has to invalidate uv's cache.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# The published sdist holds the package and its metadata, and none of the
# repo's tooling or tests.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
